<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Vinylhunter – inloggen</title>
<style>
  :root { --bg: #141413; --card: #1e1d1b; --fg: #eeece8; --muted: #9d9a93; --line: #2f2d2a; --accent: #3ddc84; --bad: #ff7a6b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  input { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; padding: 12px; border-radius: 999px; border: 0; background: var(--accent); color: #000; }
  button:disabled { opacity: .5; }
  #msg { color: var(--bad); font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<form id="f">
  <h1>Vinylhunter</h1>
  <p>Voer het wachtwoord in dat je hebt gekregen.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Wachtwoord" required autofocus>
  <button id="btn">Inloggen</button>
  <div id="msg" role="alert"></div>
</form>
<script>
const $ = id => document.getElementById(id);
$('f').onsubmit = async e => {
  e.preventDefault();
  $('btn').disabled = true; $('msg').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
    const data = await r.json().catch(() => ({}));
    if (r.ok) { location.reload(); return; }
    $('msg').textContent = data.error || 'Inloggen mislukt';
    $('pw').value = '';
    if (data.locked) { $('pw').disabled = true; return; }
  } catch { $('msg').textContent = 'Geen verbinding'; }
  $('btn').disabled = false;
};
</script>
</body>
</html>
